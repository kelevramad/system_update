[project]
name = "system-update-cli"
version = "8.3.0"
description = "Cross-platform package manager scanner/updater"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "pip>=26.0.1",
    "pytest-xdist>=3.8.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
# Secure WinRM transport over HTTPS — avoids passing the password on argv.
# Install with: uv pip install 'system-update-cli[remote-secure]'
remote-secure = ["pywinrm>=0.5.0"]

[project.scripts]
system-update = "system_update.cli:_main_entry"

[dependency-groups]
dev = [
    "isort>=6.1.0",
    "pyright>=1.1.380",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "taskipy>=1.14.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.taskipy.tasks]
check = "ruff check ."
diff = "ruff format --diff ."
format = "ruff format ."
test = "pytest -v"
test-cov = "pytest --cov=. --cov-report=term-missing --cov-report=html"
typecheck = "pyright"
typecheck-stats = "pyright --stats"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
skip_empty = true
show_missing = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system_update"]
